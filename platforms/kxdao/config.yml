# 科学刀 KXDAO 每日签到（已实测核对，2026-07-28）
#
# 站点：https://www.kxdao.net/   Discuz! 论坛
# 签到插件：aigeo_sign（aigeo 每日签到）
# 签到方式：登录后访问签到页取 var _fh（即 formhash）
#           → POST plugin.php?id=aigeo_sign:api&action=checkin
#           请求体 formhash=<_fh>&source=checkin_page，返回 JSON。
#           成功首签 already_checked=false 且 credits_got>0；今日已签 already_checked=true。
# 多账号凭证（每平台最多 2 个变量名，见 docs/config-guide.md）：
#   · CT_KXDAO_COOKIE   仅 Cookie，多个用 & 或换行分隔（最简单）。
#   · CT_KXDAO_AUTH     一体化：每行 `cookie||账号||密码`，三段用 || 分隔，
#                       任意段留空即跳过；支持换行或 & 分隔多账号。
#                       Cookie 优先；Cookie 失败且有账号密码时自动登录刷新并写回本行。

platform: 科学刀KXDAO
engine: forum
base_url: "https://www.kxdao.net"
cookie_env: CT_KXDAO_COOKIE

# 账号密码登录（可选，与 cookie 配合实现自动续期）：
# - 推荐用一体化变量 CT_KXDAO_AUTH（每行 cookie||账号||密码，缺哪段留空即可）。
# - 该站未开启登录验证码(seccode)，可正常自动刷新（已实测）。
login:
  login_page: "member.php?mod=logging&action=login"
  loginfield: email          # email | username | auto（auto 会依次尝试 email / 用户名）
  auth_env: CT_KXDAO_AUTH    # 一体化变量名（cookie||账号||密码）

tasks:
  - name: 每日签到
    type: sign
    # 签到页取 formhash（页面内嵌 var _fh = 'xxxxxxxx'）
    sign_url: "/aigeo_sign-checkin.html"
    formhash_re: "var _fh\\s*=\\s*'([a-f0-9]{8})'"
    # 真实签到接口（已实测）
    action_url: "plugin.php?id=aigeo_sign:api&action=checkin"
    method: post
    payload:
      formhash: "{formhash}"
      source: "checkin_page"
    # 返回 JSON（无空格，如 {"code":0,"data":{"already_checked":true,...}}），
    # 靠 already_checked 字段区分首签/已签
    success_keywords:
      - 'already_checked":false'
    already_keywords:
      - 'already_checked":true'
    fail_keywords:
      - "未登录"
      - "请先登录"
      - "游客"
