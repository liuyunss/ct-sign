# 远景论坛 PCBETA 每日打卡（机制已抓包分析，2026-07-28）
#
# 站点：https://bbs.pcbeta.com/   Discuz! 论坛（Cookie 域 pcbeta.com，全子域通用）
# 签到方式：非常规签到插件，而是 Discuz「任务系统」的每日任务（id=149 每日打卡），
#           入口在用户中心子域 i.pcbeta.com：
#           GET home.php?mod=task&do=apply&id=149  （领取即完成，无需 formhash）
#           · 首次：返回「恭喜您，任务已成功完成，您将收到奖励通知」
#           · 已签：返回「抱歉，本期您已申请过此任务，请下期再来」
#           · 未登录：返回「您需要先登录才能继续本操作」
# 登录页无验证码(seccode)、无强制安全提问（已实测），账号密码可自动登录续期。
#           ⚠️ 站点对频繁登录敏感，请勿反复用密码登录；正常运行时 Cookie 优先，
#           仅在 Cookie 失效时才会触发一次自动登录并写回新 Cookie。
# 多账号凭证（每平台最多 2 个变量名，见 docs/config-guide.md）：
#   · CT_PCBETA_COOKIE   仅 Cookie，多个用 & 或换行分隔（最简单）。
#   · CT_PCBETA_AUTH     一体化：每行 `cookie||账号||密码`，三段用 || 分隔，
#                        任意段留空即跳过；支持换行或 & 分隔多账号。
#                        Cookie 优先；Cookie 失败且有账号密码时自动登录刷新并写回本行。

platform: 远景论坛PCBETA
engine: forum
# 任务系统与登录都走用户中心子域；Cookie 域为 .pcbeta.com，与 bbs 子域通用
base_url: "https://i.pcbeta.com"
cookie_env: CT_PCBETA_COOKIE

# 账号密码登录（可选，与 cookie 配合实现自动续期）：
# - 推荐用一体化变量 CT_PCBETA_AUTH（每行 cookie||账号||密码，缺哪段留空即可）。
# - 该站未开启登录验证码(seccode)，可自动刷新（已实测登录页）。
# - loginfield 固定 email（账号为邮箱），避免 auto 模式失败时多发一次登录请求。
login:
  login_page: "member.php?mod=logging&action=login"
  loginfield: email
  auth_env: CT_PCBETA_AUTH

tasks:
  - name: 每日打卡
    type: sign
    # 任务系统免 formhash：不配 sign_url/formhash_re，直接 GET 领取任务
    action_url: "home.php?mod=task&do=apply&id=149"
    method: get
    encoding: utf-8
    # 关键词刻意不含标点，兼容全角/半角逗号差异
    success_keywords:
      - "任务已成功完成"
      - "您将收到奖励通知"
    already_keywords:
      - "已申请过此任务"
      - "请下期再来"
      - "不是进行中的任务"
    fail_keywords:
      - "您需要先登录"
      - "请先登录"
      - "游客"
