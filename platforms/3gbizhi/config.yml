# 3G壁纸 每日签到（2026-07-28 接入；待在青龙环境验证）
#
# 站点：https://www.3gbizhi.com/   自定义 ThinkPHP 壁纸站（非 Discuz）
# 登录方式：ThinkPHP CSRF(__token__) + POST /api/user/login
#           （由 common/login.py 的 thinkphp_login 处理，login_type: thinkphp）
# 签到接口：GET /api/user/checkin.html（需登录态，返回 JSON {code,msg}）
#   实测：未登录返回 {"code":401,"msg":"请登录后操作"}（路径正确）
#   注意：请求必须带 Referer 头，否则腾讯 EdgeOne WAF 会拦截返回 404 "An error occurred"
# 引擎：api（标准 JSON 接口流，复用现有引擎，无需新写引擎）
# 多账号凭证（每平台最多 2 个变量名，见 docs/config-guide.md）：
#   · CT_3GBIZHI_COOKIE   仅 Cookie，多个用 & 或换行分隔（最简单）。
#   · CT_3GBIZHI_AUTH     一体化：每行 `cookie||账号||密码`，三段用 || 分隔，
#                         任意段留空即跳过；支持换行或 & 分隔多账号。
#                         Cookie 优先；Cookie 失败且有账号密码时自动登录刷新并写回本行。

platform: 3G壁纸
engine: api
base_url: "https://www.3gbizhi.com"   # 站点域名（不含末尾 /）
cookie_env: CT_3GBIZHI_COOKIE
# 本平台走代理（青龙容器 IP 被 EdgeOne WAF 封禁时换 IP 用）。
# proxy: true 表示使用全局环境变量 CT_PROXY 的代理地址；其他平台不写这行即不走代理。
# 若想用一份名单统一管理，可改为在 config/config.yml 写 proxy_platforms: [3gbizhi]。
proxy: true

# ThinkPHP 账号密码登录（可选，与 cookie 配合实现自动续期）：
# - 推荐用一体化变量 CT_3GBIZHI_AUTH（每行 cookie||账号||密码，缺哪段留空即可）。
# - 注意：login 走 thinkphp_login（非 Discuz），由 login_type 决定。
login:
  login_type: thinkphp           # 走 common/login.py 的 thinkphp_login
  login_page: "user/login.html"  # GET 此页抠 __token__（注意不可带 X-Requested-With）
  login_api: "api/user/login"    # POST 此接口完成登录
  token_field: "__token__"       # CSRF 隐藏域字段名
  account_field: "account"       # 账号字段名
  password_field: "password"     # 密码字段名
  success_code: 1                # 登录成功时的 code 值（按站点实际调整）
  auth_env: CT_3GBIZHI_AUTH      # 一体化变量名（cookie||账号||密码）
  # 关键：登录接口仅返回 JSON（不设 Set-Cookie），需把 userinfo 里的 uid/token
  #       手动注入 Cookie，后续签到接口才能识别登录态（参考可用脚本逻辑）。
  cookie_fields:
    uid: "data.userinfo.user_id"
    token: "data.userinfo.token"

# 注意：3g壁纸 前端有腾讯 EdgeOne CDN/WAF。
#   拦截特征：IP 被封时返回 {"code":404,"msg":"An error occurred","time":<数字>}（time 为数字、msg 英文，
#             与站点正常响应 {"code":401,"msg":"请登录后操作","time":"<字符串>"} 不同）。
#   若持续 404：青龙容器 IP 可能被 WAF 临时封禁，配全局环境变量 CT_PROXY 并在本文件写 proxy: true 走代理换 IP，
#   或等待封禁过期。只有被点名（proxy: true 或 proxy_platforms 名单）的平台才走代理，其他平台不受影响。

tasks:
  - name: 每日签到
    type: sign
    url: "/api/user/setUserSignin"
    method: post
    encoding: utf-8
    # 站点以 XHR 调用该接口；带 Referer 防 EdgeOne WAF 拦截（实测缺 Referer 会 404）。
    # 参考可用脚本：POST /api/user/setUserSignin，无需额外参数，登录态靠 uid/token Cookie 识别。
    headers:
      X-Requested-With: "XMLHttpRequest"
      Referer: "https://www.3gbizhi.com/user/index.html"
    code_field: code
    success_codes: [1]           # 命中视为成功；若站点用其他成功码，改这里（api 引擎 JSON 优先判定）
    success_keywords:
      - "签到成功"
      - "成功签到"
    already_keywords:
      - "今日已签到"
      - "今日已经签到"
      - "已经签到"
      - "已签到"
    fail_keywords:
      - "请登录"
      - "未登录"
      - "登录后操作"
      - "An error occurred"     # EdgeOne WAF 拦截特征：IP 被封时返回此英文错误（非站点正常响应）
